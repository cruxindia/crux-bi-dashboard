function finPrepare(it,x,file){const L=x.sheets.filter(s=>s.rows.length);const n=L.reduce((a,s)=>a+s.rows.length,0);
 if(x.kind==='collection'){const bank=L.filter(s=>s.role==='bank');const tot=bank.reduce((a,s)=>a+s.controls.credit,0);
  it.summary=`${bank.length} bank-account sheets · ${fmt(bank.reduce((a,s)=>a+s.rows.length,0))} receipts · ${fmtL(tot)} · ${ddmm(x.period_from)} to ${ddmm(x.data_through)}`+(L.some(s=>s.role==='main')?' · "Main" kept as a cross-check only':'');it.period=x.data_through;it.status=x.data_through?'Ready':'No receipt dates found'}
 else{const led=L.filter(s=>s.role==='ledger');const os=led.reduce((a,s)=>a+s.controls.os,0),un=led.reduce((a,s)=>a+s.controls.unadj.reduce((b,u)=>b+u.amount,0),0);
  const nm=x.name_period,lm=new Date(file.lastModified||Date.now()).toISOString().slice(0,10),today=new Date().toISOString().slice(0,10);
  const endOf=ym=>{const d=new Date(ym+'-01T00:00:00Z');d.setUTCMonth(d.getUTCMonth()+1);d.setUTCDate(0);return d.toISOString().slice(0,10)};
  if(!it.asof){if(nm&&lm.slice(0,7)===nm){it.asof=lm;it.asofBasis=`Inferred from the file date ${ddmm(lm)}; workbook labelled ${mlabel(nm+'-01')}`}else if(nm){const e=endOf(nm);it.asof=e<today?e:today;it.asofBasis=`Inferred from the workbook label ${mlabel(nm+'-01')}`}else{it.asof=lm;it.asofBasis='Inferred from the file date'}}
  it.summary=`${led.length} location sheets · ${fmt(n)} invoice lines · outstanding ${fmtL(os)} · unadjusted receipts ${fmtL(un)} · snapshot date ${ddmm(it.asof)} (check)`;it.period=it.asof;it.status='Ready'}
 it.issues=x.issues||[]}
/* Content hash of a finance workbook = SHA-256 over "sheet|chunk|SHA-256 of the 2,000-row chunk as stored" (sheets in byte order) — the same value the server computes at commit, so a re-saved or re-downloaded copy with the same rows is recognised even when the file bytes differ. */
async function finContentHash(data){const ser=v=>Array.isArray(v)?'['+v.map(ser).join(', ')+']':JSON.stringify(v);const N=2000;const enc=new TextEncoder();
 const hx=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
 const parts=[];for(const sh of data)for(let i=0,seq=0;i<sh.rows.length;i+=N,seq++)parts.push([sh.sheet,seq,await hx(ser(sh.rows.slice(i,i+N)))]);
 parts.sort((p,q)=>p[0]<q[0]?-1:p[0]>q[0]?1:p[1]-q[1]);return hx(parts.map(p=>p.join('|')).join(';'))}
async function finImport(it,progress){const x=it.x;const data=x.sheets.filter(s=>s.rows.length);
 const controls={sheets:Object.fromEntries(x.sheets.map(s=>[s.sheet,{role:s.role,...s.controls}])),issues:x.issues};
 const b=await finIngest('begin',{kind:x.kind,file_name:it.file.name,file_hash:it.hash,source_ref:'upload:'+it.file.name,as_of:x.kind==='collection'?x.data_through:it.asof,
  as_of_basis:x.kind==='collection'?'last receipt date in the file':(it.asofBasis||'entered at upload'),period_from:x.period_from||null,period_to:x.period_to||null,name_period:x.name_period?x.name_period+'-01':null,controls,content_sha256:await finContentHash(data)});
 if(b.duplicate)return b.duplicate_content?'Already imported (same rows as an earlier file, different file copy) — unchanged':'Already imported (identical file) — unchanged';
 const N=S.mode==='mcp'?400:2000;let done=0;const tot=data.reduce((a,s)=>a+s.rows.length,0);
 try{for(const sh of data)for(let i=0,seq=0;i<sh.rows.length;i+=N,seq++){await finIngest('stage',{upload_id:b.upload_id,sheet:sh.sheet,seq,role:sh.role,cols:sh.cols,rows:sh.rows.slice(i,i+N)});done+=Math.min(N,sh.rows.length-i);progress(`Staging ${fmt(done)}/${fmt(tot)}`)}
  const c=await finIngest('commit',{upload_id:b.upload_id,expected:Object.fromEntries(data.map(s=>[s.sheet,s.rows.length]))});
  if(c.duplicate_content)return`Already imported (same rows as upload ${c.same_as}) — not added`;
  progress('Rebuilding finance figures…');let dv=null;try{dv=await finIngest('derive',{})}catch(e){}
  return`Imported ${fmt(tot)} rows`+(c.status==='superseded'?' (kept; a file with later receipts is current)':'')+(dv?' · figures rebuilt':' · figures refresh within 10 minutes')}
 catch(e){try{await finIngest('reject',{upload_id:b.upload_id,reason:'upload interrupted: '+e.message})}catch{}throw e}}

/* ---------- Plain-language explanations: "?" buttons and automatic hints on technical terms ---------- */
const GLOSS={
 mtd:['MTD (month-to-date)','The total from the 1st of this month up to the report date. Example: MTD on 9-Oct = all cases from 1-Oct to 9-Oct.'],
 target:['Target','The month\'s goal set by management — in cases, or in ₹ for revenue target. It does not change with performance.'],
 achievement:['Achievement (% Achmt)','How much of the target is already done: achieved so far ÷ target. Example: 4,000 of 10,000 cases = 40%. Compare it with how much of the month has passed.'],
 projection:['Projection','Our estimate of where the month will end if the current pace continues. It is not a target and not a guarantee; the range shows how far it could reasonably move.'],
 runrate:['Run-rate','Average business per working day so far × working days in the month. Working days are Monday–Saturday minus declared no-report days.'],
 required:['Required per day','Cases (or ₹) needed on each remaining working day to reach the target: (target − achieved) ÷ working days left.'],
 shortfall:['Shortfall','How much is still missing to reach the target: target − achieved (negative means ahead of target).'],
 daily:['Daily count','Cases added since the previous report: today\'s MTD − the previous report\'s MTD. After a holiday it covers more than one day.'],
 revenue:['Revenue','Cases × rate per case. If a rate changes during the month, each day\'s cases use the rate in force that day.'],
 revtarget:['Revenue target','The case target valued at the rates in force. If a rate changes mid-month: cases already done at the rates applied + the remaining target cases at the new rate.'],
 rate:['Rate','₹ charged per case for that client at that location.'],
 rate_change:['Rate change from a date','When a client\'s rate changes during the month, enter the new rate and the date it applies from. Cases reported before that date stay at the old rate, so revenue and revenue target are never back-dated by mistake. Every change needs a reason and can be undone.'],
 tat:['TAT (turnaround time)','How long work takes from start to finish. Case TAT = case received → case completed. Field TAT = visit assigned → visit report reviewed.'],
 sla:['SLA (service level agreement)','The deadline promised to the client for each case. "SLA met %" = share of completed cases finished before that deadline.'],
 median:['Median','The middle value: half the cases were faster, half slower. Less affected by a few extreme cases than an average.'],
 p90:['P90','90% of cases were finished within this time; only the slowest 10% took longer.'],
 force1:['Force1 utilisation','How much of the work goes through the Force1 app. Case level: Force1 cases ÷ all cases in the tracker for the same month, location and client. Field level: field visits submitted by field executives in Force1 ÷ all field visits.'],
 fieldexec:['Field executive','A person who only submits field visit reports in Force1 and never creates cases or handles document/tele checks.'],
 backoffice:['Back office','Anyone who creates cases or points, or handles document or tele checks. Field visits they submit are counted as manual (outside the field executive route).'],
 lfl:['Like-for-like','Compares the same stretch of days: e.g. this month up to the 9th vs last month up to the 9th — never a part month against a full month.'],
 organic:['Organic expectation','The business we would expect with no special effort: a blend of each location–client\'s last month (MoM 50%), last quarter with its trend (QoQ 40%) and its own pattern for this month last year (YoY 10%), with the usual seasonal pattern and the number of working days. Click the ? next to a figure to see exactly how it was calculated.'],
 effort:['Effort growth','Business above the organic expectation (actual − organic). A negative value means the location is below what it would normally do — investigate.'],
 coverage:['Coverage','Share of a client\'s verified active branches that sent Crux at least one case in the last 6 months.'],
 attrition:['Attrition','People who left in the month ÷ average headcount of the month.'],
 stakeholder:['Stakeholder','The manager responsible for the location in the tracker.'],
 penalty:['Penalty','A ₹ amount charged against Crux (e.g. by a client for a delay or quality issue). Entered by admins with a reason; shown as a report and not deducted from revenue.'],
 potential:['Remaining-days potential','What the rest of the month can still add, based on the pace so far and how earlier months finished from the same day. Shown as low / likely / high.'],
 working:['Working days','Monday–Saturday, minus days marked "no report" (holidays).']};
const GLOSS_AUTO=[[/\bMTD\b/,'mtd'],[/% ?Achmt|Achievement/,'achievement'],[/Projection|Projected|Forecast/,'projection'],[/Run-?rate/i,'runrate'],[/Required (per|\/) ?day|Needed per day/i,'required'],
 [/Shortfall/,'shortfall'],[/\bTAT\b/,'tat'],[/\bSLA\b/,'sla'],[/\bP90\b/,'p90'],[/[Mm]edian/,'median'],[/Force1 utilisation|Force usage/,'force1'],[/Like-for-like/i,'lfl'],
 [/Organic/,'organic'],[/Effort/,'effort'],[/Coverage/,'coverage'],[/Attrition/,'attrition'],[/Revenue target|Revenue Tgt/i,'revtarget'],[/Daily count|Day's addition|Daily change/i,'daily'],
 [/Penalt/,'penalty'],[/potential/i,'potential'],[/Field executive/,'fieldexec'],[/Back office/,'backoffice'],[/^Target\b|\bTarget$/,'target'],[/^Stakeholder$/,'stakeholder'],[/^Rate$/,'rate']];
let QPOP=null;
function qclose(){if(QPOP){QPOP.remove();QPOP=null}}
function qi(title,body){const b=el('button',{type:'button',class:'qi','aria-label':'Explain: '+title,title:'What does this mean?'},'?');
 b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const same=QPOP&&QPOP._src===b;qclose();if(same)return;
  const p=el('div',{class:'qpop',role:'dialog','aria-label':title},el('strong',{},title));const add=x=>{if(x==null)return;if(typeof x==='function')x=x();(Array.isArray(x)?x:[x]).forEach(y=>p.append(typeof y==='string'?el('p',{},y):y))};add(body);
  p.append(el('button',{type:'button',class:'qx','aria-label':'Close'},'×'));p.querySelector('.qx').onclick=qclose;p._src=b;document.body.append(p);QPOP=p;
  const r=b.getBoundingClientRect(),w=Math.min(340,window.innerWidth-24);p.style.width=w+'px';let x=r.left+window.scrollX-8;x=Math.max(12,Math.min(x,window.scrollX+window.innerWidth-w-12));
  let y=r.bottom+window.scrollY+6;p.style.left=x+'px';p.style.top=y+'px';const ph=p.offsetHeight;if(r.bottom+ph+12>window.innerHeight&&r.top>ph+12)p.style.top=(r.top+window.scrollY-ph-6)+'px';p.querySelector('.qx').focus()});
 return b}
function hint(key){const g=GLOSS[key];return g?qi(g[0],g[1]):null}
document.addEventListener('click',e=>{if(QPOP&&!e.target.closest('.qpop'))qclose()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')qclose()});
window.addEventListener('resize',qclose);
function annotate(root){if(!root||!root.querySelectorAll)return;root.querySelectorAll('.tile .k, th, h3, h4, .kpi-l').forEach(n=>{if(n.dataset.qi||n.querySelector('.qi'))return;n.dataset.qi='1';
  const t=(n.childNodes[0]&&n.childNodes[0].nodeType===3?n.childNodes[0].textContent:n.textContent).trim();if(!t||t.length>60)return;const hit=GLOSS_AUTO.find(([re])=>re.test(t));if(!hit)return;
  const b=hint(hit[1]);if(b){b.classList.add('qi-auto');n.append(' ',b)}})}
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)annotate(n.matches&&n.matches('.tile .k, th, h3, h4')?n.parentNode:n)}))).observe(document.getElementById('view'),{childList:true,subtree:true});

/* ---------- Collapsible sections: every sub-heading in a page folds its content ---------- */
const FOLD={};try{Object.assign(FOLD,JSON.parse(localStorage.getItem('crux_fold')||'{}'))}catch{}
function foldKey(h){return (S.section||'')+'|'+h.textContent.replace(/[▾▸?]/g,'').trim().slice(0,60)}
function foldApply(h,closed){h.setAttribute('aria-expanded',String(!closed));h.classList.toggle('folded',closed);let n=h.nextElementSibling;while(n&&!/^H[23]$/.test(n.tagName)){n.classList.toggle('fold-hide',closed);n=n.nextElementSibling}}
function makeFoldable(h){if(h.dataset.fold||h.closest('#askPanel,.zt-panel table'))return;h.dataset.fold='1';h.classList.add('foldable');h.tabIndex=0;h.setAttribute('role','button');h.title='Click to collapse or expand';
 const k=foldKey(h);const toggle=()=>{const c=!h.classList.contains('folded');FOLD[k]=c;try{localStorage.setItem('crux_fold',JSON.stringify(FOLD))}catch{}foldApply(h,c)};
 h.addEventListener('click',toggle);h.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});
 if(FOLD[k])setTimeout(()=>foldApply(h,true),0)}
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType!==1)return;if(n.tagName==='H3')makeFoldable(n);n.querySelectorAll&&n.querySelectorAll('h3').forEach(makeFoldable);
 if(n.tagName==='H3'||n.tagName==='H2')return;let p=n.previousElementSibling;while(p&&!/^H[23]$/.test(p.tagName))p=p.previousElementSibling;if(p&&p.tagName==='H3'&&p.classList.contains('folded'))n.classList.add('fold-hide')}))).observe(document.getElementById('view'),{childList:true,subtree:true});

window.addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(k&&k!==S.section&&SECTIONS.some(x=>x[0]===k))go(k)});
boot();
</script>
