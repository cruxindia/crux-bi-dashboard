<style>
:root{--bg:#F3F5F8;--panel:#FFFFFF;--ink:#18212E;--muted:#5A6676;--line:#DCE1E8;--blue:#1E4F8F;--blue-soft:#E3ECF7;--ochre:#C2892B;--bad:#B23A30;--good:#2D7A57;--warn-soft:#FBF1DF;--bad-soft:#F8E4E1;--good-soft:#E2F1E9;
 --f:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;--fn:'Archivo Narrow','Arial Narrow',var(--f);color-scheme:light;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121821;--panel:#19212C;--ink:#E6EBF2;--muted:#9AA6B6;--line:#2A3442;--blue:#7FA8E0;--blue-soft:#1E2B3D;--ochre:#D9A64E;--bad:#E07A70;--good:#6CC197;--warn-soft:#33291A;--bad-soft:#3A2220;--good-soft:#1B3328;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121821;--panel:#19212C;--ink:#E6EBF2;--muted:#9AA6B6;--line:#2A3442;--blue:#7FA8E0;--blue-soft:#1E2B3D;--ochre:#D9A64E;--bad:#E07A70;--good:#6CC197;--warn-soft:#33291A;--bad-soft:#3A2220;--good-soft:#1B3328;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f)}
a{color:var(--blue)}button,select,input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--panel);border-right:1px solid var(--line);padding:18px 0;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font:700 17px/1.2 var(--f);margin:0 18px 4px}nav .sub{color:var(--muted);font-size:12px;margin:0 18px 16px}
nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 18px;cursor:pointer;border-left:3px solid transparent}
nav button[aria-current="page"]{border-left-color:var(--blue);background:var(--blue-soft);font-weight:600}
nav button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
nav .fresh{margin:18px;font-size:12px;color:var(--muted);line-height:1.6}
main{min-width:0}
.filters{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 22px;display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.filters label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:2px}
.filters select{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);min-width:130px}
.mode{margin-left:auto;font-size:12px;color:var(--muted)}
section{padding:20px 22px 40px;max-width:1500px}
h2{font:600 20px/1.25 var(--f);margin:0 0 4px}h3{font:600 15px/1.3 var(--f);margin:22px 0 8px}
.lede{color:var(--muted);margin:0 0 16px;max-width:75ch}
.pace{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px 14px;margin-bottom:16px}
.pace .nums{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 28px}
.big{font:700 44px/1 var(--fn);font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.of{font:600 18px var(--fn);color:var(--muted)}
.track{position:relative;height:30px;margin:16px 0 8px;background:var(--blue-soft);border-radius:4px;overflow:hidden}
.track .mtd{position:absolute;left:0;top:0;bottom:0;background:var(--blue)}
.track .fc{position:absolute;top:9px;height:12px;background:repeating-linear-gradient(45deg,var(--ochre),var(--ochre) 4px,transparent 4px,transparent 8px);opacity:.85}
.track .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tile .k{font-size:12px;color:var(--muted)}.tile .v{font:700 26px/1.15 var(--fn);font-variant-numeric:tabular-nums}.tile .n{font-size:12px;color:var(--muted)}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--ochre)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.chartbox{position:relative;height:260px}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:620px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);font-weight:600;cursor:pointer;user-select:none;z-index:1}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--fn);font-size:14px}
tr:hover td{background:var(--blue-soft)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.tools input[type=search]{padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);min-width:220px}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 11px;border-radius:6px;cursor:pointer}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.chip{display:inline-block;padding:1px 7px;border-radius:10px;font-size:12px;background:var(--blue-soft)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.good{background:var(--good-soft);color:var(--good)}.chip.warn{background:var(--warn-soft);color:var(--ochre)}
.insight{border-left:3px solid var(--blue);background:var(--panel);padding:10px 14px;margin-bottom:8px;border-radius:0 6px 6px 0}
.insight.risk{border-left-color:var(--bad)}.insight.opportunity{border-left-color:var(--good)}.insight small{display:block;color:var(--muted);margin-top:3px}
.note{font-size:12px;color:var(--muted);margin-top:6px;max-width:90ch}
.banner{padding:10px 14px;border-radius:6px;background:var(--warn-soft);margin-bottom:12px}
.banner.err{background:var(--bad-soft)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:28px;text-align:center;background:var(--panel)}
.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.colpick{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px}
.login{max-width:380px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px}
.login input{width:100%;padding:8px;margin:6px 0 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.hidden{display:none!important}
@media (max-width:820px){.app{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;overflow-x:auto;padding:6px}nav h1,nav .sub,nav .fresh{display:none}nav button{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;width:auto}nav button[aria-current="page"]{border-bottom-color:var(--blue)}.grid2{grid-template-columns:1fr}.big{font-size:34px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

 </div>
 <div id="view"></div>
</main>
</div>

<script>
'use strict';
const CFG={project:'czdjbbhxboweawqbjywr',url:'https://czdjbbhxboweawqbjywr.supabase.co',key:'sb_publishable_J7fFRVLVB_h5SHZcquWfXA_p_O30PkF',server:'Supabase'};
const S={mode:null,mcp:null,sb:null,role:null,email:null,meta:null,section:'overview',charts:[]};
const $=s=>document.querySelector(s), el=(t,a={},...c)=>{const e=document.createElement(t);for(const[k,v]of Object.entries(a)){if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v!=null)e.setAttribute(k,v)}c.flat().forEach(x=>x!=null&&e.append(x.nodeType?x:document.createTextNode(String(x))));return e};
const nf=new Intl.NumberFormat('en-IN'),fmt=v=>v==null||isNaN(v)?'–':nf.format(Math.round(v)),pct=v=>v==null||isNaN(v)?'–':(v*100).toFixed(1)+'%',hrs=v=>v==null?'–':(v>=48?(v/24).toFixed(1)+' d':(+v).toFixed(1)+' h'),inr=v=>v==null?'–':'₹'+nf.format(Math.round(v));
const mlabel=m=>m?new Date(m+'T00:00:00Z').toLocaleDateString('en-IN',{month:'short',year:'numeric',timeZone:'UTC'}):'–';

/* ---------- data layer: connector mode (inside Claude) or Supabase Auth mode (standalone) ---------- */
const lit=v=>"'"+String(v).replace(/'/g,"''")+"'", dt=v=>{if(v&&!/^\d{4}-\d{2}-\d{2}$/.test(v))throw new Error('bad date');return v?lit(v)+'::date':'null::date'}, js=o=>{const t='$j'+Math.random().toString(36).slice(2,8)+'$';const s=JSON.stringify(o??{});if(s.includes(t))throw new Error('tag clash');return t+s+t+'::jsonb'};
const GROUPS={case_tat:['location','unit','product','branch','client'],point_tat:['category','unit','point_type','location','branch','pincode','executive','client'],monthly:['total','region','stakeholder','zone','tier','location','client']};
function sqlFor(fn,a){const m=a.month,f=a.filters||{};const g=k=>{const v=a.group||GROUPS[k][0];if(!GROUPS[k].includes(v))throw new Error('bad group');return lit(v)};
 switch(fn){case'meta':return'bi.api_meta()';case'overview':return`bi.api_overview(${dt(m)},${js(f)})`;case'forecast':return`bi.api_forecast(${dt(m)},${js(f)})`;
 case'zonal':return`bi.api_zonal(${dt(a.snapshot)},${js(f)})`;case'daily':return`bi.api_daily(${dt(m)},${js(f)})`;case'monthly':return`bi.api_monthly(${dt(a.from)},${dt(a.to)},${js(f)},${g('monthly')})`;
 case'force':return`bi.api_force(${dt(m)},${js(f)})`;case'force_trend':return`bi.api_force_trend(${js(f)})`;case'case_tat':return`bi.api_case_tat(${dt(m)},${js(f)},${g('case_tat')})`;
 case'point_tat':return`bi.api_point_tat(${dt(m)},${js(f)},${g('point_tat')})`;case'manual_tat':return`bi.api_manual_tat(${dt(m)},${js(f)})`;case'employees':return`bi.api_employees(${dt(m)},${js(f)})`;
 case'insights':return`bi.api_insights(${dt(m)},${js(f)})`;case'exceptions':return'bi.api_exceptions(300)';case'mapping_queue':return'bi.api_mapping_queue()';}
 throw new Error('unknown fn '+fn)}
function parseSqlPayload(p){let rows=p;if(p&&typeof p==='object'&&!Array.isArray(p)&&typeof p.result==='string')p=p.result;
 if(typeof p==='string'){const m=p.match(/<untrusted-data-[^>]+>\s*([\s\S]*?)\s*<\/untrusted-data-/);rows=JSON.parse(m?m[1]:p)}
 if(!Array.isArray(rows)||!rows.length)throw new Error('Unexpected response from database');return rows[0].r}
async function mcpSql(q){try{const res=await S.mcp.callTool(CFG.server,'execute_sql',{project_id:CFG.project,query:q},{cache:false});return parseSqlPayload(res.payload)}
 catch(e){throw mcpErr(e)}}
function mcpErr(e){const c=e&&e.code;const msg={server_not_connected:'The Supabase connector is not connected for you. Add it in Claude settings, then reload.',needs_reauth:'Your Supabase connector needs to be reconnected (Settings → Connectors), then reload.',not_granted:'Access to the Supabase connector was declined for this page. Allow it from the page permissions to load data.',consent_required:'Allow this page to use your Supabase connector to load data.',tool_error:'The database rejected the request: '+((e.result&&JSON.stringify(e.result.content||'').slice(0,300))||e.message),server_unavailable:'Supabase did not respond in time. Try again in a moment.'}[c];
 const er=new Error(msg||((c?c+': ':'')+(e&&e.message||e)));er.code=c;return er}
async function api(fn,args={}){if(S.mode==='mcp')return mcpSql(`select ${sqlFor(fn,args)} as r`);
 const {data,error}=await S.sb.rpc('bi_call',{p_fn:fn,p_args:args});if(error)throw new Error(error.message);return data}
async function adminCall(action,p){if(S.mode==='mcp'){if(action==='mapping_update')return mcpSql(`select bi.api_mapping_update(${lit('connector:'+(S.email||'owner'))},${js(p)}) as r`);if(action==='refresh_employees')return mcpSql(`select jsonb_build_object('employees',bi.refresh_employee_classification()) as r`)}
 const {data,error}=await S.sb.rpc('bi_admin',{p_action:action,p});if(error)throw new Error(error.message);return data}
async function ingest(action,payload){if(S.mode==='mcp')return mcpSql(`select bi.ingest_as(${lit('connector:'+(S.email||'owner'))},${lit(action)},${js(payload)}) as r`);
 const {data,error}=await S.sb.rpc('bi_ingest',{p_token:null,p_action:action,p_payload:payload});if(error)throw new Error(error.message);return data}

/* ---------- boot ---------- */
async function boot(){
 if(window.claude&&claude.use){try{const m=await claude.use('mcp');if(m){S.mode='mcp';S.mcp=m;S.role='admin';try{const u=await claude.use('user');if(u){const me=await u.me();S.email=me&&me.email||null}}catch{}}}catch{}}
 if(!S.mode){if(!window.supabase){showLoginMsg('This page needs either the Claude connector or the Supabase client library.');$('#login').classList.remove('hidden');return}
  S.mode='supabase';S.sb=supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,detectSessionInUrl:true}});
  const {data:{session}}=await S.sb.auth.getSession();if(!session){$('#login').classList.remove('hidden');return}S.email=session.user.email}
 try{S.meta=await api('meta')}catch(e){$('#login').classList.remove('hidden');showLoginMsg(e.message.includes('not authorised')?'Your account is signed in but not approved for this dashboard. Ask an administrator to add '+(S.email||'your email')+'.':e.message);return}
 if(S.mode==='supabase'){S.role=S.meta.role||'viewer'}
 $('#app').classList.remove('hidden');$('#modeLbl').textContent=S.mode==='mcp'?'Live via your Supabase connector':'Signed in as '+S.email;
 initFilters();renderFresh();buildNav();go(location.hash.slice(1)||'overview')}
function showLoginMsg(t){$('#loginMsg').textContent=t}
$('#signin').addEventListener('click',async()=>{const {error}=await S.sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)return showLoginMsg(error.message);location.reload()});
$('#magic').addEventListener('click',async()=>{const {error}=await S.sb.auth.signInWithOtp({email:$('#em').value.trim(),options:{shouldCreateUser:false,emailRedirectTo:location.href.split('#')[0]}});showLoginMsg(error?error.message:'Check your inbox for the sign-in link.')});

const SECTIONS=[['overview','Overview'],['tracker','Business tracker'],['growth','Growth & trends'],['force','Force & reconciliation'],['tat','TAT & operations'],['people','People'],['quality','Data quality'],['upload','Upload centre']];
function buildNav(){const n=$('#navbtns');n.innerHTML='';SECTIONS.forEach(([k,l])=>{if(['upload'].includes(k)&&S.role!=='admin')return;n.append(el('button',{'data-k':k,onclick:()=>go(k)},l))})}
function go(k){S.section=k;location.hash=k;document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.k===k?'page':'false'));render()}
function filters(){const f={};const s=$('#fStake').value,r=$('#fRegion').value,z=$('#fZone').value,l=$('#fLoc').value,c=$('#fFam').value;if(s)f.stakeholder=s;if(r)f.region=r;if(z)f.zone_group=z;if(l)f.location_id=+l;if(c)f.client_family=c;return f}
function initFilters(){const m=S.meta;const mo=$('#fMonth');m.months.forEach(x=>mo.append(el('option',{value:x},mlabel(x))));
 const L=m.locations.filter(l=>l.zone_group);const uniq=(a)=>[...new Set(a.filter(Boolean))].sort();
 uniq(L.map(l=>l.stakeholder)).forEach(v=>$('#fStake').append(el('option',{value:v},v)));uniq(L.map(l=>l.region)).forEach(v=>$('#fRegion').append(el('option',{value:v},v)));
 const zones={};L.forEach(l=>zones[l.zone_group]=l.zone_label);Object.entries(zones).sort((a,b)=>a[1].localeCompare(b[1])).forEach(([k,v])=>$('#fZone').append(el('option',{value:k},v)));
 fillLoc();m.client_families.forEach(v=>$('#fFam').append(el('option',{value:v},v)));
 ['#fMonth','#fStake','#fRegion','#fZone','#fLoc','#fFam'].forEach(s=>$(s).addEventListener('change',()=>{if(s!=='#fLoc'&&s!=='#fMonth'&&s!=='#fFam')fillLoc();render()}))}
function fillLoc(){const f=filters(),cur=$('#fLoc').value,s=$('#fLoc');s.innerHTML='<option value="">All</option>';S.meta.locations.filter(l=>l.zone_group&&(!f.stakeholder||l.stakeholder===f.stakeholder)&&(!f.region||l.region===f.region)&&(!f.zone_group||l.zone_group===f.zone_group)).sort((a,b)=>a.label.localeCompare(b.label)).forEach(l=>s.append(el('option',{value:l.id},l.label)));if([...s.options].some(o=>o.value===cur))s.value=cur}
function renderFresh(){const fr=S.meta.freshness;const lines=[`Tracker: ${fr.zonal_latest_snapshot} (${fr.zonal_snapshots} snapshots)`,`Case Wise: latest case ${String(fr.case_latest_received_ist).slice(0,10)}`,`Point Wise: latest point ${String(fr.point_latest_created_ist).slice(0,10)}`];$('#fresh').innerHTML='';$('#fresh').append(el('strong',{},'Data as of'),...lines.map(t=>el('div',{},t)),el('div',{class:'note'},'Sources update independently; each section states the period it uses.'))}

/* ---------- helpers ---------- */
function kill(){S.charts.forEach(c=>c.destroy());S.charts=[]}

const C=()=>{const s=getComputedStyle(document.documentElement);return{blue:s.getPropertyValue('--blue').trim(),ochre:s.getPropertyValue('--ochre').trim(),bad:s.getPropertyValue('--bad').trim(),good:s.getPropertyValue('--good').trim(),muted:s.getPropertyValue('--muted').trim()}};
function tile(k,v,n,cls){return el('div',{class:'tile'},el('div',{class:'k'},k),el('div',{class:'v '+(cls||'')},v),n?el('div',{class:'n'},n):null)}
function csv(rows,cols,name){const esc=v=>{v=v==null?'':String(v);return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};const t=[cols.map(c=>esc(c.label)).join(','),...rows.map(r=>cols.map(c=>esc(c.raw?c.raw(r):r[c.key])).join(','))].join('\n');
 const save=async()=>{if(window.claude&&claude.use){try{const d=await claude.use('downloads');if(d){await d.save({filename:name,data:t});return}}catch(e){if(e&&e.code==='cancelled')return}}const a=el('a',{href:URL.createObjectURL(new Blob([t],{type:'text/csv'})),download:name});document.body.append(a);a.click();a.remove()};save()}
function table(rows,cols,{name='export.csv',search=true,pageSize=200,defaultHidden=[]}={}){
 const wrap=el('div');const hidden=new Set(defaultHidden);let q='',sk=null,sd=1,page=0;
 const tw=el('div',{class:'tablewrap'});const info=el('span',{class:'note'});
 const tools=el('div',{class:'tools'},search?el('input',{type:'search',placeholder:'Search this table',oninput:e=>{q=e.target.value.toLowerCase();page=0;draw()},'aria-label':'Search table'}):null,
  el('button',{class:'btn',onclick:()=>csv(view(),cols.filter(c=>!hidden.has(c.key)),name)},'Export CSV'),
  el('details',{},el('summary',{class:'btn'},'Columns'),el('div',{class:'colpick'},cols.map(c=>{const cb=el('input',{type:'checkbox'});cb.checked=!hidden.has(c.key);cb.onchange=()=>{cb.checked?hidden.delete(c.key):hidden.add(c.key);draw()};return el('label',{},cb,' ',c.label)}))),info);

 const dq=S.meta.dq_open||{};s.append(el('div',{class:'tiles'},Object.entries(dq).map(([k,v])=>tile(k.replace(/_/g,' '),fmt(v),'open'))));
 const fr=S.meta.freshness;s.append(el('h3',{},'Source coverage (latest month received per location group)'),table(Object.keys(fr.case_coverage).sort().map(k=>({unit:k,case:fr.case_coverage[k],point:fr.point_coverage[k]||null})),[{key:'unit',label:'Location group'},{key:'case',label:'Case Wise to',fmt:mlabel},{key:'point',label:'Point Wise to',fmt:v=>v?mlabel(v):el('span',{class:'chip warn'},'none')}],{search:false,name:'coverage.csv'}));
 if(S.role!=='admin'){s.append(el('p',{class:'note'},'Exception details and mapping review are available to administrators.'));return}
 const [ex,mq]=await Promise.all([api('exceptions'),api('mapping_queue')]);
 const act=(kind,idk,opts)=>(v,row)=>{const sel=el('select',{'aria-label':'Review status'},opts.map(o=>el('option',{value:o},o)));sel.value=v;sel.onchange=async()=>{try{await adminCall('mapping_update',{kind,[idk]:row[idk],status:sel.value})}catch(e){alert(e.message);sel.value=v}};return sel};
 s.append(el('h3',{},'Exceptions'),table(ex.recent||[],[{key:'id',label:'#',num:1},{key:'rule',label:'Rule'},{key:'severity',label:'Severity'},{key:'source_category',label:'Source'},{key:'record_key',label:'Record'},{key:'detail',label:'Evidence',fmt:v=>JSON.stringify(v).slice(0,160),raw:r=>JSON.stringify(r.detail)},{key:'status',label:'Status',fmt:act('dq','id',['open','accepted','resolved'])},{key:'created_at',label:'Logged',fmt:v=>String(v).slice(0,16)}],{name:'exceptions.csv'}));
 if(mq.locations)s.append(el('h3',{},'Location aliases'),table(mq.locations,[{key:'source',label:'Source'},{key:'alias',label:'Alias'},{key:'location',label:'Maps to'},{key:'method',label:'Method'},{key:'confidence',label:'Confidence',num:1},{key:'evidence',label:'Evidence',fmt:v=>v?JSON.stringify(v).slice(0,120):'–',raw:r=>JSON.stringify(r.evidence)},{key:'status',label:'Review',fmt:act('location_alias','id',['auto','confirmed','rejected','needs_review'])}],{name:'location_aliases.csv'}));
 if(mq.point_types)s.append(el('h3',{},'Point type classification'),table(mq.point_types,[{key:'name',label:'Point type'},{key:'category',label:'Category',fmt:(v,row)=>{const sel=el('select',{'aria-label':'Category'},['field','document','tele','unknown'].map(o=>el('option',{value:o},o)));sel.value=v;sel.onchange=async()=>{try{await adminCall('mapping_update',{kind:'point_type',name:row.name,category:sel.value,status:'confirmed'})}catch(e){alert(e.message)}};return sel}},{key:'rule',label:'Rule'},{key:'evidence',label:'Evidence',fmt:v=>v?JSON.stringify(v).slice(0,120):'–'},{key:'review_status',label:'Review'},{key:'reviewed_by',label:'Reviewed by'}],{name:'point_types.csv'}));
 if(mq.clients)s.append(el('h3',{},'Client aliases'),table(mq.clients,[{key:'source',label:'Source'},{key:'alias',label:'Alias'},{key:'client_code',label:'Client'},{key:'method',label:'Method'},{key:'confidence',label:'Confidence',num:1},{key:'status',label:'Review'}],{name:'client_aliases.csv'}));
});

/* ---------- Upload centre ---------- */
const UNITS={PUNE:'Pune',DELHI:'Delhi',BHOPAL:'Bhopal',MUMBAI:'Mumbai',MMUMBAI:'Mumbai',NASHIK:'Nashik',ODISHA:'Odisha',GUJARAT:'Gujarat',KOLKATA:'Kolkata',LUCKNOW:'Lucknow',GUWAHATI:'Guwahati',BANGLORE:'Bangalore',BANGALORE:'Bangalore',HYDERABAD:'Hyderabad',JHARKHAND:'Jharkhand',MARATHWADA:'Marathwada',NAGPURYASH:'Nagpur-Yash',NAGPURSUDHIR:'Nagpur-Sudhir',KOLHAPURVINAYAK:'Kolhapur-Vinayak'};
const vUpload=guard(async s=>{if(S.role!=='admin'){s.append(el('div',{class:'banner'},'Uploads are limited to administrators.'));return}
 s.append(el('h2',{},'Upload centre'),el('p',{class:'lede'},'Drop any mix of Zonal Tracker, Case Wise and Point Wise files. Each file is identified, previewed and validated before anything is written. Re-uploading the same file changes nothing; a corrected file updates only the records that changed.'));
 const list=el('div');const inp=el('input',{type:'file',multiple:'',accept:'.xlsx,.xls',class:'hidden',id:'fin'});
 const drop=el('div',{class:'drop',tabindex:0,role:'button','aria-label':'Choose files to upload'},el('p',{},el('strong',{},'Drop .xlsx files here'),' or ',el('button',{class:'btn',onclick:()=>inp.click()},'choose files')),el('p',{class:'note'},'Personal data (applicant names, mobile, PAN, Aadhaar, account numbers, addresses) is removed in your browser before upload.'),inp);
 ['dragover','dragenter'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('over')}));
 drop.addEventListener('drop',ev=>handle([...ev.dataTransfer.files]));inp.onchange=()=>handle([...inp.files]);s.append(drop,list);
 const items=[];const runBtn=el('button',{class:'btn primary',disabled:''},'Import validated files');list.append(el('div',{class:'tools'},runBtn));const tb=el('div');list.append(tb);
 async function handle(files){for(const file of files){const it={file,status:'Reading…'};items.push(it);draw();try{const buf=await file.arrayBuffer();it.hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',buf))].map(b=>b.toString(16).padStart(2,'0')).join('');
   const wb=XLSX.read(buf,{type:'array',cellFormula:true,sheets:undefined});const x=CruxExtract.extractWorkbook(wb,file.name);it.x=x;it.kind=x.kind;
   if(!x.kind){it.status='Not recognised';it.err=true}else if(x.kind==='zonal'){it.snapshot=x.snapshot_date;it.period=x.report_month;const leaf=x.rows.filter(r=>r.row_type==='leaf');const t=leaf.reduce((a,r)=>a+(r.mtd_cases||0),0);it.summary=`${leaf.length} leaf rows · MTD ${fmt(t)}`+(x.control?` · source total ${fmt(x.control.mtd)}`+(Math.abs(t-x.control.mtd)>0.5?' (differs — will be logged)':' ✓'):'');it.status=x.snapshot_date?'Ready':'Needs snapshot date'}
   else{const base=file.name.replace(/\.xlsx?$/i,'').replace(/\s*\(\d+\)$/,'');const tok=base.replace(/_[A-Za-z]+$/,'').toUpperCase().replace(/[^A-Z]/g,'');it.group=UNITS[tok]||null;
    const months={};x.rows.forEach(r=>{const d=r.received_at||r.created_at;if(d){const ist=new Date(Date.parse(d)+19800000).toISOString().slice(0,7);months[ist]=(months[ist]||0)+1}});const top=Object.entries(months).sort((a,b)=>b[1]-a[1])[0];it.period=top?top[0]+'-01':null;
    it.summary=`${fmt(x.rows.length)} rows`+(x.issues.length?` · ${x.issues.length} issue(s)`:'');it.status=(it.group&&it.period)?'Ready':'Needs location group / month'}}catch(e){it.status='Failed: '+e.message;it.err=true}draw()}}
 function draw(){tb.innerHTML='';runBtn.disabled=!items.some(i=>i.status==='Ready');
  tb.append(table(items.map((i,ix)=>({...i,ix})),[{key:'name',label:'File',fmt:(v,r)=>r.file.name},{key:'kind',label:'Type',fmt:v=>({zonal:'Zonal Tracker',case:'Case Wise',point:'Point Wise'})[v]||'–'},
   {key:'group',label:'Location group',fmt:(v,r)=>r.kind==='case'||r.kind==='point'?(()=>{const sel=el('select',{'aria-label':'Location group'},el('option',{value:''},'Choose…'),[...new Set(Object.values(UNITS))].sort().map(u=>el('option',{value:u},u)));sel.value=v||'';sel.onchange=()=>{items[r.ix].group=sel.value||null;items[r.ix].status=(items[r.ix].group&&items[r.ix].period)?'Ready':'Needs location group / month';draw()};return sel})():'–'},
   {key:'period',label:'Period / snapshot',fmt:(v,r)=>{const i2=el('input',{type:r.kind==='zonal'?'date':'month',value:r.kind==='zonal'?(r.snapshot||''):(v||'').slice(0,7),'aria-label':'Period'});i2.onchange=()=>{const it=items[r.ix];if(r.kind==='zonal')it.snapshot=i2.value;else it.period=i2.value?i2.value+'-01':null;it.status=(r.kind==='zonal'?it.snapshot:(it.group&&it.period))?'Ready':it.status;draw()};return i2}},
   {key:'summary',label:'Preview'},{key:'status',label:'Status',fmt:v=>el('span',{class:'chip '+(/^Ready|^Imported|unchanged/.test(v)?'good':/Fail|Not rec|rejected/.test(v)?'bad':'warn')},v)}],{search:false,pageSize:100}))}
 runBtn.onclick=async()=>{runBtn.disabled=true;for(const it of items.filter(i=>i.status==='Ready')){try{it.status='Uploading…';draw();it.status=await importOne(it,p=>{it.status=p;draw()})}catch(e){it.status='Failed: '+e.message}draw()}S.meta=await api('meta');renderFresh()};
});
async function importOne(it,progress){const x=it.x;
 if(x.kind==='zonal'){const b=await ingest('begin',{category:'zonal',file_name:it.file.name,file_hash:it.hash,snapshot_date:it.snapshot,period_month:x.report_month});if(b.duplicate)return'Already imported (identical file) — unchanged';
  await ingest('stage',{batch_id:b.batch_id,seq_start:0,rows:[{snapshot_date:it.snapshot,report_month:x.report_month,control:x.control,issues:x.issues}]});const n=S.mode==='mcp'?40:150;
  for(let i=0;i<x.rows.length;i+=n){await ingest('stage',{batch_id:b.batch_id,seq_start:i+1,rows:x.rows.slice(i,i+n)});progress(`Staging ${Math.min(i+n,x.rows.length)}/${x.rows.length}`)}
  progress('Committing…');const c=await ingest('commit',{batch_id:b.batch_id});return`Imported snapshot ${it.snapshot}: ${fmt(c.rows||c.rows_in||x.rows.length)} rows`}
 const b=await ingest('begin',{category:x.kind,file_name:it.file.name,file_hash:it.hash,location_group:it.group,period_month:it.period});if(b.duplicate)return'Already imported (identical file) — unchanged';
 const n=S.mode==='mcp'?250:600;const acc={new:0,changed:0,unchanged:0};
 try{for(let i=0;i<x.rows.length;i+=n){await ingest('stage',{batch_id:b.batch_id,seq_start:i+1,rows:x.rows.slice(i,i+n)});const c=await ingest('commit',{batch_id:b.batch_id});for(const k in acc)acc[k]+=c[k]||0;progress(`${Math.min(i+n,x.rows.length)}/${x.rows.length} · new ${acc.new} · changed ${acc.changed}`)}
  await ingest('finalize',{batch_id:b.batch_id})}catch(e){try{await ingest('reject',{batch_id:b.batch_id,reason:'upload interrupted: '+e.message})}catch{}throw e}
 return`Imported: ${fmt(acc.new)} new · ${fmt(acc.changed)} changed · ${fmt(acc.unchanged)} unchanged`}

window.addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(k&&k!==S.section&&SECTIONS.some(x=>x[0]===k))go(k)});
boot();
</script>
