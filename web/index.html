  items.filter(i=>(i.issues||[]).length).forEach(i=>tb.append(el('details',{class:'card',style:'margin-top:8px'},el('summary',{},`Checks for ${i.file.name} (${i.issues.length})`),el('ul',{},i.issues.map(x=>el('li',{},(x.sheet?x.sheet+': ':'')+(x.detail||x.rule)))))))}
 runBtn.onclick=async()=>{runBtn.disabled=true;for(const it of items.filter(i=>i.status==='Ready')){try{it.status='Uploading…';draw();it.status=await importOne(it,p=>{it.status=p;draw()});if(it.kind==='collection'||it.kind==='outstanding'){draw();await finAfter(it)}}catch(e){it.status='Failed: '+e.message}draw()}S.meta=await api('meta');renderFresh()};
}
async function importOne(it,progress){const x=it.x;if(x.kind==='collection'||x.kind==='outstanding')return finImport(it,progress);
 /* Success is reported only after the server confirms the batch is committed (read back with 'finalize', which returns the stored batch row).
    A failed step marks the batch rejected so a retry starts clean; a slow reply after a real commit is recognised by the read-back. */
 const readBack=async id=>{try{return await ingest('finalize',{batch_id:id})}catch{return null}};
 if(x.kind==='zonal'){const b=await ingest('begin',{category:'zonal',file_name:it.file.name,file_hash:it.hash,snapshot_date:it.snapshot,period_month:x.report_month});if(b.duplicate)return'Already imported (identical file) — unchanged';
  let cz=null;try{await ingest('stage',{batch_id:b.batch_id,seq_start:0,rows:[{snapshot_date:it.snapshot,report_month:x.report_month,control:x.control,issues:x.issues}]});const n=S.mode==='mcp'?40:150;
   for(let i=0;i<x.rows.length;i+=n){await ingest('stage',{batch_id:b.batch_id,seq_start:i+1,rows:x.rows.slice(i,i+n)});progress(`Staging ${Math.min(i+n,x.rows.length)}/${x.rows.length}`)}
   progress('Committing…');cz=await ingest('commit',{batch_id:b.batch_id})}
  catch(e){const st=await readBack(b.batch_id);if(st&&st.status==='committed'&&st.rows_in===x.rows.length)return`Imported snapshot ${ddmm(it.snapshot)}: ${fmt(st.rows_in)} rows · confirmed by the server (reply was slow)`;
   try{await ingest('reject',{batch_id:b.batch_id,reason:'upload interrupted: '+e.message})}catch{}throw new Error(e.message+' — not imported; nothing from this file was saved. Upload it again.')}
  progress('Confirming with the server…');const st=await readBack(b.batch_id);
  if(!st)throw new Error('the server did not confirm the import — open Data health to check before uploading again');
  if(st.status!=='committed'||st.rows_in!==x.rows.length)throw new Error(`the server reports status "${st.status}" with ${fmt(st.rows_in||0)} of ${fmt(x.rows.length)} rows — not confirmed`);
  const pan=cz&&x.control&&cz.leaf_mtd!=null?(Math.abs(cz.leaf_mtd-x.control.mtd)<=0.5?` · leaf total ${fmt(cz.leaf_mtd)} = file's Pan India total ✓`:` · leaf total ${fmt(cz.leaf_mtd)} ≠ file's Pan India total ${fmt(x.control.mtd)} (logged in Data health)`):'';
  return`Imported snapshot ${ddmm(it.snapshot)}: ${fmt(st.rows_in)} rows · confirmed by the server`+pan+' · the dashboard shows it within about 10 minutes'}
 const b=await ingest('begin',{category:x.kind,file_name:it.file.name,file_hash:it.hash,location_group:it.group,period_month:it.period});if(b.duplicate)return'Already imported (identical file) — unchanged';
 /* 30-Oct-2026: case files are committed in smaller pieces (each piece re-checks every case's location) and a piece that hits the
    server time limit is retried twice after a pause — a commit that timed out was rolled back, so retrying it is safe. */
 const n=S.mode==='mcp'?250:(x.kind==='case'?300:600);const acc={new:0,changed:0,unchanged:0};let saved=0,st=null;
 const retry=async(step,fn)=>{for(let a=0;;a++){try{return await fn()}catch(e){if(a>=2||!/timeout|canceling statement|57014|504|502|503|Failed to fetch|NetworkError/i.test(e.message||''))throw e;
   progress(`${saved}/${x.rows.length} · server busy — retrying ${step} (${a+1}/2)…`);await new Promise(r=>setTimeout(r,a?12000:4000))}}};
 try{for(let i=0;i<x.rows.length;i+=n){await retry('upload',()=>ingest('stage',{batch_id:b.batch_id,seq_start:i+1,rows:x.rows.slice(i,i+n)}));const c=await retry('save',()=>ingest('commit',{batch_id:b.batch_id}));for(const k in acc)acc[k]+=c[k]||0;saved=Math.min(i+n,x.rows.length);progress(`${saved}/${x.rows.length} · new ${acc.new} · changed ${acc.changed}`)}
  st=await ingest('finalize',{batch_id:b.batch_id})}
 catch(e){try{await ingest('reject',{batch_id:b.batch_id,reason:'upload interrupted: '+e.message})}catch{}
  throw new Error(e.message+(saved?` — stopped after ${fmt(saved)} of ${fmt(x.rows.length)} rows; those rows are saved. Upload the file again to finish (saved rows will show as unchanged).`:' — not imported; nothing from this file was saved. Upload it again.'))}
 if(!st||st.status!=='committed')throw new Error('the server did not confirm the import'+(st?` (status "${st.status}")`:'')+' — open Data health to check before uploading again');
 return`Imported: ${fmt(acc.new)} new · ${fmt(acc.changed)} changed · ${fmt(acc.unchanged)} unchanged · confirmed by the server · case counts update within about 10 minutes; visit, TAT and workforce figures after the night refresh`}

/* ---------- Plain-language explanations: "?" buttons and automatic hints on technical terms ---------- */
const GLOSS={
 bizpotential:['Potential (all client branches)','What all our clients\' branches could bring each month: current business + each location × client back to its best three months + dormant branches reactivated + never-active branches valued at what a typical active branch of the same client gives — always shown with its clients and branches (active, dormant, never active). "Now x%" = current business as a share of the potential by value (not by branches); the gap to potential is shown step by step with the branches behind each step. Indicative, not a forecast. Business as usual is different: the trend of the business we already have (the yardstick for effort).'],
 pace:['Current pace','What the business would bring each month if it simply kept today\'s speed: the latest tracker month (projected to month end) per working day, scaled by each month\'s working days and its usual seasonal level.'],
 opportunity:['Opportunity','Potential − current pace for every team × client (never below zero): the extra business available if every client branch performed at its own best, dormant branches came back and never-active branches started.'],
 targets:['Targets (next months)','Suggested monthly targets: today\'s pace plus a growing share of the opportunity (potential − pace). For each team × client the first month is never below what it actually did last month + 2% and each later month never below the month before + 2%, except April (a proven seasonal dip), and never above 1.5× what the team actually does. Old tracker targets are not a floor. A pair with no business keeps its old target; a pair with no business and no old target gets none. Clients with no business anywhere in India in the last three months are left out.'],
 plan:['Quarter plan vs actual','This and next quarter, month by month. Plan = the saved plan, else the tracker target, else the suggested target. Completed months show the actual, the current month its likely month end, later months the current pace. Likely − plan = the difference; shortfall = the part of the plan the likely figure does not reach.'],
 variance:['Variance','Likely − plan for the same months and the same team × client: negative = likely to fall short of the plan. Likely = actual for completed months, actual so far ÷ the usual share of a month for the running month, expected at the current pace for later months.'],
 branch_list:['Branches by status','Every verified branch of our active clients: active = a Force1 case in the last three months; dormant = cases earlier, none in the last three months; never active = no Force1 case since Jan-2026. Estimated value: the branch\'s own average, or the median of active branches of the same client in the same team.'],
 target_sheet:['Target for a month','Each location × client gets a situation and its own rule: new = last month + 15%; growing = keeps half its momentum (at most +10%); stable = last month carried to the month\'s working days and season; declining = back to its 3-month average; collapsed = recovers half the gap (find the cause first); dormant = old target kept. New, growing and stable add 2.5% of their untapped branch potential, their plan share when higher and the team\'s quarter shortfall by room to grow. Never below last month + 2%, never above 1.5× capacity. Every row shows its branches (active / inactive), reason and maths. Viewers see zone and team totals and one team at a time; admins download the full sheet in the Zonal Tracker layout.'],
 rca:['Root cause','Gap = target − likely month end (expected revenue so far ÷ the usual share of a month reached by this working day). Business slowdown = expected revenue so far more than 5% below business as usual; target stretch = business at or above its usual level but likely under 95% of target; on track = likely ≥ 95%. Signals: same point last month, branches losing traction or dormant (Force1), cases past due and SLA, branch coverage.'],
 split:['Inside each group','Each group (zone, branch manager, team) broken into its members. On track = 90% or more of its own target to date; behind = 60–90%; far behind = under 60%. "Half from" = the smallest number of members that make half of the group\'s business; people are compared with the median of the same role in the same team.'],
 mtd:['MTD (month-to-date)','The total from the 1st of this month up to the report date. Example: MTD on 9-Oct = all cases from 1-Oct to 9-Oct.'],
 target:['Target','The month\'s goal set by management — in cases, or in ₹ for revenue target. It does not change with performance.'],
 achievement:['Achievement (% Achmt)','How much of the target is already done: achieved so far ÷ target. Example: 4,000 of 10,000 cases = 40%. Compare it with how much of the month has passed.'],
 projection:['Projection','Our estimate of where the month will end if the current pace continues. It is not a target and not a guarantee; the range shows how far it could reasonably move.'],
 runrate:['Run-rate','Average business per working day so far × working days in the month. Working days are Monday–Saturday minus the holidays marked in Admin → File uploads → Report calendar.'],
 required:['Required per day','Cases (or ₹) needed on each remaining working day to reach the target: (target − achieved) ÷ working days left.'],
 shortfall:['Shortfall','How much is still missing to reach the target: target − achieved (negative means ahead of target).'],
 daily:['Daily count','Cases added since the previous report: today\'s MTD − the previous report\'s MTD. After a holiday it covers more than one day.'],
 revenue:['Revenue','Cases × rate per case. If a rate changes during the month, each day\'s cases use the rate in force that day.'],
 revtarget:['Revenue target','The case target valued at the rates in force. If a rate changes mid-month: cases already done at the rates applied + the remaining target cases at the new rate.'],
 rate:['Rate','₹ charged per case for that client at that location.'],
 rate_change:['Rate change from a date','When a client\'s rate changes during the month, enter the new rate and the date it applies from. Cases reported before that date stay at the old rate, so revenue and revenue target are never back-dated by mistake. Every change needs a reason and can be undone.'],
 tat:['TAT (turnaround time)','How long work takes from start to finish. Case TAT = case received → case completed. Field TAT = visit assigned → visit report reviewed.'],
 sla:['SLA (service level agreement)','The deadline promised to the client for each case. "SLA met %" = share of completed cases finished before that deadline.'],
 median:['Median','The middle value: half the cases were faster, half slower. Less affected by a few extreme cases than an average.'],
 p90:['P90','90% of cases were finished within this time; only the slowest 10% took longer.'],
 force1:['Force1 utilisation','How much of the work goes through the Force1 app. Case level: Force1 cases ÷ all cases in the tracker for the same month, location and client. Field level: field visits submitted by field executives in Force1 ÷ all field visits.'],
 fieldexec:['Field executive','A person who only submits field visit reports in Force1 and never creates cases or handles document/tele checks.'],
 backoffice:['Back office','Anyone who creates cases or points, or handles document or tele checks. Field visits they submit are counted as manual (outside the field executive route).'],
 lfl:['Like-for-like','Compares the same stretch of days: e.g. this month up to the 9th vs last month up to the 9th — never a part month against a full month.'],
 organic:['Business as usual (BAU)','Not the potential (that is the all-branch figure). The business we would expect from our existing business with no special effort: a blend of each location–client\'s last month (MoM 50%), last quarter with its trend (QoQ 40%) and its own pattern for this month last year (YoY 10%), with the usual seasonal pattern and the number of working days. Click the ? next to a figure to see exactly how it was calculated.'],
 effort:['Effort growth','Business above the business-as-usual expectation (actual − business as usual). A negative value means the location is below what it would normally do — investigate.'],
 coverage:['Coverage','Share of a client\'s verified active branches that sent Crux at least one case in the last 6 months.'],
 attrition:['Attrition','People who left in the month ÷ average headcount of the month. From Force1 only: a person not seen in Force1 for more than 15 days counts as left; if they appear again the gap counts as absence.'],
 stakeholder:['Stakeholder','The manager responsible for the location in the tracker.'],
 penalty:['Penalty','A ₹ amount charged against Crux (e.g. by a client for a delay or quality issue). Entered by admins with a reason; shown as a report and not deducted from revenue.'],
 potential:['Remaining-days potential','What the rest of the month can still add, based on the pace so far and how earlier months finished from the same day. Shown as low / likely / high.'],
 working:['Working days','Monday–Saturday, minus days marked "no report" (holidays).']};
const GLOSS_AUTO=[[/^Variance/i,'variance'],[/Branches by status|^Branch names/i,'branch_list'],[/Target build-up|Target sheet|^Target by team/i,'target_sheet'],[/Current pace|^Pace\b|Pace per/i,'pace'],[/Opportunity/,'opportunity'],[/Suggested target|Targets? \(next|Monthly targets/i,'targets'],[/Quarter plan|Plan vs|^Plan\b|^Outlook\b|^Likely\b/i,'plan'],[/\bMTD\b/,'mtd'],[/% ?Achmt|Achievement/,'achievement'],[/Projection|Projected|Forecast/,'projection'],[/Run-?rate/i,'runrate'],[/Required (per|\/) ?day|Needed per day/i,'required'],
 [/Shortfall/,'shortfall'],[/\bTAT\b/,'tat'],[/\bSLA\b/,'sla'],[/\bP90\b/,'p90'],[/[Mm]edian/,'median'],[/Force1 utilisation|Force usage/,'force1'],[/Like-for-like/i,'lfl'],
 [/Business[- ]as[- ]usual|\bBAU\b/i,'organic'],[/Effort/,'effort'],[/Coverage/,'coverage'],[/Attrition/,'attrition'],[/Revenue target|Revenue Tgt/i,'revtarget'],[/Daily count|Day's addition|Daily change/i,'daily'],
 [/Penalt/,'penalty'],[/^Potential\b|Business potential|÷ potential|Potential per month/i,'bizpotential'],[/potential/i,'potential'],[/Field executive/,'fieldexec'],[/Back office/,'backoffice'],[/^Target\b|\bTarget$/,'target'],[/^Stakeholder$/,'stakeholder'],[/^Rate$/,'rate']];
let QPOP=null;
function qclose(){if(QPOP){QPOP.remove();QPOP=null}}
function qi(title,body){const b=el('button',{type:'button',class:'qi','aria-label':'Explain: '+title,title:'What does this mean?'},'?');
 b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const same=QPOP&&QPOP._src===b;qclose();if(same)return;
  const p=el('div',{class:'qpop',role:'dialog','aria-label':title},el('strong',{},title));const add=x=>{if(x==null)return;if(typeof x==='function')x=x();(Array.isArray(x)?x:[x]).forEach(y=>p.append(typeof y==='string'?el('p',{},y):y))};add(body);
  p.append(el('button',{type:'button',class:'qx','aria-label':'Close'},'×'));p.querySelector('.qx').onclick=qclose;p._src=b;document.body.append(p);QPOP=p;
  const r=b.getBoundingClientRect(),w=Math.min(p.querySelector('.qdoc')?480:340,window.innerWidth-24);p.style.width=w+'px';let x=r.left+window.scrollX-8;x=Math.max(12,Math.min(x,window.scrollX+window.innerWidth-w-12));
  let y=r.bottom+window.scrollY+6;p.style.left=x+'px';p.style.top=y+'px';const ph=p.offsetHeight;if(r.bottom+ph+12>window.innerHeight&&r.top>ph+12)p.style.top=(r.top+window.scrollY-ph-6)+'px';p.querySelector('.qx').focus()});
 return b}
/* wave 101b: every "?" also shows the full math, the live figure where the page has it, and the database tables / functions behind it (bi.metric_doc via api('metric_doc')) */
let MDOC=null,MDOCP=null;const LIVE={};
const mdocLoad=()=>MDOC?Promise.resolve(MDOC):(MDOCP=MDOCP||api('metric_doc',{}).then(j=>(MDOC=(j&&j.docs)||{})).catch(e=>{MDOCP=null;throw e}));
function docBlock(key){const box=el('div',{class:'qdoc','data-doc':key},el('p',{class:'note'},'Loading the full method…'));
 mdocLoad().then(D=>{box.innerHTML='';const d=D[key];if(!d){box.append(el('p',{class:'note'},'No database reference is recorded for this figure yet.'));return}
  box.append(el('h5',{},'The math'),el('p',{class:'qmath'},d.math||'–'));
  let lv=LIVE[key];if(typeof lv==='function'){try{lv=lv()}catch(e){lv=null}}
  if(lv&&[].concat(lv).length)box.append(el('h5',{},'This figure now'),...[].concat(lv).map(x=>typeof x==='string'?el('p',{},x):x));
  box.append(el('h5',{},'Where it comes from (database)'),el('ul',{class:'qsrc'},(d.sources||[]).map(x=>el('li',{},el('code',{},x.name),x.role?' — '+x.role:''))));
  if(d.api&&d.api.length)box.append(el('p',{class:'note'},'Served by public.bi_call(…) with: ',...d.api.flatMap((a,i)=>[i?', ':'',el('code',{},a)])));
  if(d.updated_at)box.append(el('p',{class:'note'},'Method text updated '+ddmm(String(d.updated_at).slice(0,10))+' · stored in bi.metric_doc'))
 }).catch(e=>{box.innerHTML='';box.append(el('p',{class:'note'},'Method reference unavailable: '+e.message))});return box}
function hint(key){const g=GLOSS[key];return g?qi(g[0],()=>{const b=typeof g[1]==='function'?g[1]():g[1];return[].concat(b==null?[]:b,docBlock(key))}):null}
document.addEventListener('click',e=>{if(QPOP&&!e.target.closest('.qpop'))qclose()});

function annotate(root){if(!root||!root.querySelectorAll)return;root.querySelectorAll('.tile .k, th, h3, h4, .kpi-l').forEach(n=>{if(n.dataset.qi||n.querySelector('.qi'))return;n.dataset.qi='1';
  const t=(n.childNodes[0]&&n.childNodes[0].nodeType===3?n.childNodes[0].textContent:n.textContent).trim();if(!t||t.length>60)return;const hit=GLOSS_AUTO.find(([re])=>re.test(t));if(!hit)return;
  const b=hint(hit[1]);if(b){b.classList.add('qi-auto');n.append(' ',b)}})}
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)annotate(n.matches&&n.matches('.tile .k, th, h3, h4')?n.parentNode:n)}))).observe(document.getElementById('view'),{childList:true,subtree:true});

/* ---------- Collapsible sections: every sub-heading in a page folds its content ---------- */
const FOLD={};try{Object.assign(FOLD,JSON.parse(localStorage.getItem('crux_fold')||'{}'))}catch{}
/* wave 103: on the Overview the detail sections start folded (headline, at a glance, zones, plan, operations & collections and branch managers open) */
const FOLD0=[/^overview\|(Period comparison|Operations pulse|Daily additions|What needs attention|Top branch opportunities|Plan, forecast|Operations and Collections|Branch managers)/];
function foldKey(h){return (S.section||'')+'|'+h.textContent.replace(/[▾▸?]/g,'').trim().slice(0,60)}
// a heading that sits in a header row (.tools: title + controls) folds what follows the row (wave 106 fix: those sections did not fold before)
const foldHead=n=>n&&(/^H[23]$/.test(n.tagName)||(n.matches&&n.matches('.tools')&&!!n.querySelector(':scope>h3')));
function foldApply(h,closed){h.setAttribute('aria-expanded',String(!closed));h.classList.toggle('folded',closed);const st=h.parentElement&&h.parentElement.matches('.tools')?h.parentElement:h;
 if(st!==h){let m=h.nextElementSibling;while(m){m.classList.toggle('fold-hide',closed);m=m.nextElementSibling}}
 let n=st.nextElementSibling;while(n&&!foldHead(n)){n.classList.toggle('fold-hide',closed);n=n.nextElementSibling}}
// wave 106: on the analysis pages the first three sections (in page order) are open and the rest start folded (a list of further topics) until the user opens them.
// Decided while the page loads (sections arrive in any order), never after: a section the user opened or closed keeps the user's choice.
const FOLD_AUTO=k=>!/^(overview|present|tracker)$/.test(k||'')&&!String(k||'').startsWith('adm_');
function autoFold(){if(!FOLD_AUTO(S.section)||Date.now()-(S.renderAt||0)>12000)return;const sec=document.querySelector('#view section');if(!sec)return;
 [...sec.querySelectorAll('h3.foldable')].forEach((h,i)=>{if(i<3||h.dataset.auto)return;h.dataset.auto='1';if(FOLD[foldKey(h)]===undefined&&!h.classList.contains('folded'))foldApply(h,true)})}
function makeFoldable(h){if(h.dataset.fold||h.closest('#askPanel,.zt-panel table'))return;h.dataset.fold='1';h.classList.add('foldable');h.tabIndex=0;h.setAttribute('role','button');h.title='Click to collapse or expand';
 const k=foldKey(h);const toggle=()=>{const c=!h.classList.contains('folded');FOLD[k]=c;try{localStorage.setItem('crux_fold',JSON.stringify(FOLD))}catch{}foldApply(h,c)};
 h.addEventListener('click',toggle);h.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});
 if(FOLD[k]===undefined?FOLD0.some(re=>re.test(k)):FOLD[k])setTimeout(()=>foldApply(h,true),0)}
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType!==1)return;if(n.tagName==='H3')makeFoldable(n);n.querySelectorAll&&n.querySelectorAll('h3').forEach(makeFoldable);
 if(n.tagName==='H3'||n.tagName==='H2')return;let p=n.previousElementSibling;while(p&&!foldHead(p))p=p.previousElementSibling;const ph=p&&(p.tagName==='H3'?p:p.querySelector&&p.querySelector(':scope>h3'));
 if(ph&&ph.classList.contains('folded'))n.classList.add('fold-hide');else if(n.parentElement&&n.parentElement.matches('.tools')){const t=n.parentElement.querySelector(':scope>h3.folded');if(t)n.classList.add('fold-hide')}}))).observe(document.getElementById('view'),{childList:true,subtree:true});
