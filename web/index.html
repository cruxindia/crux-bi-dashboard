   {key:'group',label:'Location group',fmt:(v,r)=>r.kind==='case'||r.kind==='point'?(()=>{const sel=el('select',{'aria-label':'Location group'},el('option',{value:''},'Choose…'),[...new Set(Object.values(UNITS))].sort().map(u=>el('option',{value:u},u)));sel.value=v||'';sel.onchange=()=>{items[r.ix].group=sel.value||null;items[r.ix].status=(items[r.ix].group&&items[r.ix].period)?'Ready':'Needs location group / month';draw()};return sel})():'–'},
   {key:'period',label:'Period / snapshot',fmt:(v,r)=>{const i2=el('input',{type:r.kind==='zonal'?'date':'month',value:r.kind==='zonal'?(r.snapshot||''):(v||'').slice(0,7),'aria-label':'Period'});i2.onchange=()=>{const it=items[r.ix];if(r.kind==='zonal')it.snapshot=i2.value;else it.period=i2.value?i2.value+'-01':null;it.status=(r.kind==='zonal'?it.snapshot:(it.group&&it.period))?'Ready':it.status;draw()};return i2}},
   {key:'summary',label:'Preview'},{key:'status',label:'Status',fmt:v=>el('span',{class:'chip '+(/^Ready|^Imported|unchanged/.test(v)?'good':/Fail|Not rec|rejected/.test(v)?'bad':'warn')},v)}],{search:false,pageSize:100}))}
 runBtn.onclick=async()=>{runBtn.disabled=true;for(const it of items.filter(i=>i.status==='Ready')){try{it.status='Uploading…';draw();it.status=await importOne(it,p=>{it.status=p;draw()})}catch(e){it.status='Failed: '+e.message}draw()}S.meta=await api('meta');renderFresh()};
});
async function importOne(it,progress){const x=it.x;
 if(x.kind==='zonal'){const b=await ingest('begin',{category:'zonal',file_name:it.file.name,file_hash:it.hash,snapshot_date:it.snapshot,period_month:x.report_month});if(b.duplicate)return'Already imported (identical file) — unchanged';
  await ingest('stage',{batch_id:b.batch_id,seq_start:0,rows:[{snapshot_date:it.snapshot,report_month:x.report_month,control:x.control,issues:x.issues}]});const n=S.mode==='mcp'?40:150;
  for(let i=0;i<x.rows.length;i+=n){await ingest('stage',{batch_id:b.batch_id,seq_start:i+1,rows:x.rows.slice(i,i+n)});progress(`Staging ${Math.min(i+n,x.rows.length)}/${x.rows.length}`)}
  progress('Committing…');const c=await ingest('commit',{batch_id:b.batch_id});return`Imported snapshot ${it.snapshot}: ${fmt(c.rows||c.rows_in||x.rows.length)} rows`}
 const b=await ingest('begin',{category:x.kind,file_name:it.file.name,file_hash:it.hash,location_group:it.group,period_month:it.period});if(b.duplicate)return'Already imported (identical file) — unchanged';
 const n=S.mode==='mcp'?250:600;const acc={new:0,changed:0,unchanged:0};
 try{for(let i=0;i<x.rows.length;i+=n){await ingest('stage',{batch_id:b.batch_id,seq_start:i+1,rows:x.rows.slice(i,i+n)});const c=await ingest('commit',{batch_id:b.batch_id});for(const k in acc)acc[k]+=c[k]||0;progress(`${Math.min(i+n,x.rows.length)}/${x.rows.length} · new ${acc.new} · changed ${acc.changed}`)}
  await ingest('finalize',{batch_id:b.batch_id})}catch(e){try{await ingest('reject',{batch_id:b.batch_id,reason:'upload interrupted: '+e.message})}catch{}throw e}
 return`Imported: ${fmt(acc.new)} new · ${fmt(acc.changed)} changed · ${fmt(acc.unchanged)} unchanged`}

/* ---------- Collapsible sections: every sub-heading in a page folds its content ---------- */
const FOLD={};try{Object.assign(FOLD,JSON.parse(localStorage.getItem('crux_fold')||'{}'))}catch{}
function foldKey(h){return (S.section||'')+'|'+h.textContent.replace(/[▾▸]/g,'').trim().slice(0,60)}
function foldApply(h,closed){h.setAttribute('aria-expanded',String(!closed));h.classList.toggle('folded',closed);let n=h.nextElementSibling;while(n&&!/^H[23]$/.test(n.tagName)){n.classList.toggle('fold-hide',closed);n=n.nextElementSibling}}
function makeFoldable(h){if(h.dataset.fold||h.closest('#askPanel,.zt-panel table'))return;h.dataset.fold='1';h.classList.add('foldable');h.tabIndex=0;h.setAttribute('role','button');h.title='Click to collapse or expand';
 const k=foldKey(h);const toggle=()=>{const c=!h.classList.contains('folded');FOLD[k]=c;try{localStorage.setItem('crux_fold',JSON.stringify(FOLD))}catch{}foldApply(h,c)};
 h.addEventListener('click',toggle);h.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});
 if(FOLD[k])setTimeout(()=>foldApply(h,true),0)}
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType!==1)return;if(n.tagName==='H3')makeFoldable(n);n.querySelectorAll&&n.querySelectorAll('h3').forEach(makeFoldable);
 if(n.tagName==='H3'||n.tagName==='H2')return;let p=n.previousElementSibling;while(p&&!/^H[23]$/.test(p.tagName))p=p.previousElementSibling;if(p&&p.tagName==='H3'&&p.classList.contains('folded'))n.classList.add('fold-hide')}))).observe(document.getElementById('view'),{childList:true,subtree:true});

window.addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(k&&k!==S.section&&SECTIONS.some(x=>x[0]===k))go(k)});
boot();
</script>
