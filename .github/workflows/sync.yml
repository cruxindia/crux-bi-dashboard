name: Sync code from Supabase export
# Pulls the code-only bundle (migrations as applied + app + docs) and commits it.
# The bundle never contains business data; the export token is read-only and expires.
# wave 105f: a file changed on main after its Supabase copy was stored (a reviewed pull request that was merged, for example from the
# weekly dashboard improver) is kept, not overwritten; merging such a pull request to main also publishes the site.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/sync.yml', 'web/**', 'docs/**']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: sync
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://czdjbbhxboweawqbjywr.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_J7fFRVLVB_h5SHZcquWfXA_p_O30PkF
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch bundle
        env:
          BI_EXPORT_TOKEN: ${{ secrets.BI_EXPORT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, pathlib, subprocess
          def rpc(fn):
              req = urllib.request.Request(os.environ['SUPABASE_URL'] + '/rest/v1/rpc/' + fn,
                  data=json.dumps({'p_token': os.environ['BI_EXPORT_TOKEN']}).encode(),
                  headers={'apikey': os.environ['SUPABASE_PUBLISHABLE_KEY'], 'Content-Type': 'application/json'})
              return json.load(urllib.request.urlopen(req, timeout=120))
          bundle = rpc('bi_repo_export')
          try:
              times = rpc('bi_repo_export_times')
          except Exception as e:
              print(f'no file times ({e}); every file is written'); times = {}
          root = pathlib.Path('.').resolve()
          kept = []
          for rel, content in bundle.items():
              p = (root / rel).resolve()
              if root not in p.parents or rel.startswith('.github/') or rel.endswith(('.xlsx', '.xls', '.csv')):
                  raise SystemExit(f'refusing path {rel}')
              if p.exists() and rel in times:
                  ct = subprocess.run(['git', 'log', '-1', '--format=%ct', '--', rel], capture_output=True, text=True).stdout.strip()
                  if ct.isdigit() and int(ct) > int(times[rel]) and p.read_text(encoding='utf-8') != content:
                      kept.append(rel)
                      continue
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding='utf-8')
          print(f'wrote {len(bundle) - len(kept)} files; kept the newer GitHub version of {len(kept)}: {kept}')
          PY
      - name: Commit
        run: |
          git config user.name "crux-bi-sync"
          git config user.email "crux-bi-sync@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no changes" || git commit -m "Sync code, migrations and docs from Supabase export ($(date -u +%F))"
          git push
  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
